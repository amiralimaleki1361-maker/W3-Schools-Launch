<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3 School launch</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>
    <div id="carouselExample" class="carousel slide">
        <button class="w3-button w3-block w3-green w3-hide-large w3-hide-medium" commandfor="download"
            command="show-modal">Download <i class="fa fa-android"></i> <i class="fa fa-apple"></i> <i
                class="fa fa-windows"></i></button>
        <div class="mySlides w3-animate-opacity">
            <img class="w3-image" src="https://placehold.co/200" alt="Image 1" style="min-width:500px" width="1500"
                height="1000">
            <div class="w3-display-left w3-padding w3-hide-small" style="width:35%">
                <div class="w3-black w3-opacity w3-hover-opacity-off w3-padding-large w3-round-large">
                    <h1 class="w3-xlarge">Take photos with our app</h1>
                    <hr class="w3-opacity">
                    <p>Super simple installation: free of charge</p>
                    <p><button class="w3-button w3-block w3-green w3-round" commandfor="download"
                            command="show-modal">Download <i class="fa fa-android"></i> <i class="fa fa-apple"></i> <i
                                class="fa fa-windows"></i></button></p>
                </div>
            </div>
        </div>
        <div class="mySlides w3-animate-opacity">
            <img class="w3-image" src="https://placehold.co/200" alt="Image 2" style="min-width:500px" width="1500"
                height="1000">
            <div class="w3-display-left w3-padding w3-hide-small" style="width:35%">
                <div class="w3-black w3-opacity w3-hover-opacity-off w3-padding-large w3-round-large">
                    <h1 class="w3-xlarge w3-text-red"><b>CLICK!</b> Fast and Easy</h1>
                    <hr class="w3-opacity">
                    <p>Choose from thousands of features</p>
                    <p><button class="w3-button w3-block w3-red w3-round" commandfor="download"
                            command="show-modal">Download <i class="fa fa-android"></i> <i class="fa fa-apple"></i> <i
                                class="fa fa-windows"></i></button></p>
                </div>
            </div>
        </div>
        <div class="mySlides w3-animate-opacity">
            <img class="w3-image" src="https://placehold.co/200" alt="Image 3" style="min-width:500px" width="1500"
                height="1000">
            <div class="w3-display-left w3-padding w3-hide-small" style="width:35%">
                <div class="w3-black w3-opacity w3-hover-opacity-off w3-padding-large w3-round-large">
                    <h1 class="w3-xlarge">Smart Design</h1>
                    <hr class="w3-opacity">
                    <p>Customize photos as you go</p>
                    <p><button class="w3-button w3-block w3-indigo w3-round" commandfor="download"
                            command="show-modal">Download <i class="fa fa-android"></i> <i class="fa fa-apple"></i> <i
                                class="fa fa-windows"></i></button></p>
                </div>
            </div>
        </div>
        <a class="button  d-right w3-margin-right w3-round w3-hide-small w3-hover-light-grey">Take Tour </a>

        <a class="button d-block w3-black d-sm-none w3-hide-medium text-center">Take Tour </a>
    </div>

</body>

</html>
